<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Notifications</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        .button:hover { background: #0056b3; }
        .result { margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 3px; white-space: pre-wrap; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Notifications API</h1>
        
        <div class="section">
            <h2>1. Login</h2>
            <button class="button" onclick="testLogin()">Login as Test Owner</button>
            <div id="loginResult" class="result"></div>
        </div>
        
        <div class="section">
            <h2>2. Check Token</h2>
            <button class="button" onclick="checkToken()">Check Stored Token</button>
            <div id="tokenResult" class="result"></div>
        </div>
        
        <div class="section">
            <h2>3. Test Notifications API</h2>
            <button class="button" onclick="testNotifications()">Get All Notifications</button>
            <button class="button" onclick="testUnreadNotifications()">Get Unread Notifications</button>
            <div id="notificationsResult" class="result"></div>
        </div>
        
        <div class="section">
            <h2>4. Test WebSocket</h2>
            <button class="button" onclick="testWebSocket()">Connect WebSocket</button>
            <button class="button" onclick="disconnectWebSocket()">Disconnect WebSocket</button>
            <div id="websocketResult" class="result"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        let socket = null;

        async function testLogin() {
            const resultDiv = document.getElementById('loginResult');
            resultDiv.textContent = 'Logging in...';
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'testowner@example.com',
                        password: 'password123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const token = data.data?.access_token || data.access_token;
                    localStorage.setItem('access_token', token);
                    localStorage.setItem('refresh_token', data.data?.refresh_token || data.refresh_token);
                    
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Login successful!\nToken: ${token.substring(0, 50)}...`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Login failed: ${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Error: ${error.message}`;
            }
        }

        function checkToken() {
            const resultDiv = document.getElementById('tokenResult');
            const token = localStorage.getItem('access_token');
            const refreshToken = localStorage.getItem('refresh_token');
            
            if (token) {
                resultDiv.className = 'result success';
                resultDiv.textContent = `✅ Token found!\nAccess Token: ${token.substring(0, 50)}...\nRefresh Token: ${refreshToken ? refreshToken.substring(0, 50) + '...' : 'Not found'}`;
            } else {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ No token found in localStorage';
            }
        }

        async function testNotifications() {
            const resultDiv = document.getElementById('notificationsResult');
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ No token found. Please login first.';
                return;
            }
            
            resultDiv.textContent = 'Fetching notifications...';
            
            try {
                const response = await fetch(`${API_BASE}/notification`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Notifications fetched!\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Failed: ${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Error: ${error.message}`;
            }
        }

        async function testUnreadNotifications() {
            const resultDiv = document.getElementById('notificationsResult');
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ No token found. Please login first.';
                return;
            }
            
            resultDiv.textContent = 'Fetching unread notifications...';
            
            try {
                const response = await fetch(`${API_BASE}/notification/unread`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Unread notifications fetched!\n${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Failed: ${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Error: ${error.message}`;
            }
        }

        function testWebSocket() {
            const resultDiv = document.getElementById('websocketResult');
            const token = localStorage.getItem('access_token');
            
            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ No token found. Please login first.';
                return;
            }
            
            resultDiv.textContent = 'Connecting to WebSocket...';
            
            try {
                socket = io('http://localhost:3000', {
                    auth: { token }
                });
                
                socket.on('connect', () => {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ WebSocket connected!';
                });
                
                socket.on('notification', (notification) => {
                    resultDiv.textContent += `\n📨 New notification: ${JSON.stringify(notification, null, 2)}`;
                });
                
                socket.on('disconnect', () => {
                    resultDiv.textContent += '\n❌ WebSocket disconnected';
                });
                
                socket.on('error', (error) => {
                    resultDiv.className = 'result error';
                    resultDiv.textContent += `\n❌ WebSocket error: ${error}`;
                });
                
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Error: ${error.message}`;
            }
        }

        function disconnectWebSocket() {
            if (socket) {
                socket.disconnect();
                socket = null;
                document.getElementById('websocketResult').textContent += '\n🔌 WebSocket disconnected manually';
            }
        }
    </script>
    
    <!-- Socket.IO client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</body>
</html>
